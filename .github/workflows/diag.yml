# Temporary workflow used to verify the 26.3 port, will be removed.
name: diagnostics
on: [push]

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        continue-on-error: true
        run: ./gradlew build --stacktrace 2>&1 | tail -80
      - name: dump signatures
        if: always()
        run: bash .github/diag.sh
      - name: run server
        if: always()
        run: |
          mkdir -p run && echo eula=true > run/eula.txt
          timeout 420 ./gradlew runServer --args=nogui > server.log 2>&1 || true
          echo "### SERVER"; grep -nE 'elytra|Elytra|[Mm]ixin|ERROR|Exception|Caused by|Done \(|Loading [0-9]+ mods' server.log | head -80
          echo "### SERVER TAIL"; tail -30 server.log
      - name: run client
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 600 ./gradlew runClient > client.log 2>&1 || true
          echo "### CLIENT"; grep -nE 'elytra|Elytra|[Mm]ixin|ERROR|Exception|Caused by|Loading [0-9]+ mods|Backend library|OpenGL|Created:|Sound engine|crash' client.log | head -120
          echo "### CLIENT TAIL"; tail -40 client.log
