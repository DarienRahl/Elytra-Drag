# Temporary workflow used to verify the client side of the 26.3 port, will be removed.
name: client-test
on: [push]

jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 > /dev/null
      - name: run client
        run: |
          mkdir -p run
          echo 'version:4896' >> run/options.txt
          echo 'preferredGraphicsBackend:"vulkan"' >> run/options.txt
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" timeout 420 ./gradlew runClient > client.log 2>&1 || true
          echo "### CLIENT"; grep -nE 'elytra|Elytra|[Mm]ixin|ERROR|Exception|Caused by|Backend|Created:|Sound engine|Reloading|crash|Stopping' client.log | grep -v '^\s*[0-9]*:\s*- ' | head -80
          echo "### CLIENT TAIL"; tail -25 client.log
