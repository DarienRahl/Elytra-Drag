# Builds the mod and publishes the jar as a GitHub release tagged v<mod_version>.
# Start it in one of these ways:
# - Actions tab -> "build" -> "Run workflow" with "release" checked
# - Actions tab -> "release" -> "Run workflow" (once this file is on the default branch)
# - push a tag named v<mod_version>, for example: git tag v0.6-26.3 && git push origin v0.6-26.3

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: read versions
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2; }
          version=$(prop mod_version)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version in gradle.properties"
            exit 1
          fi
          {
            echo "RELEASE_TAG=v$version"
            echo "MOD_VERSION=$version"
            echo "MINECRAFT_VERSION=$(prop minecraft_version)"
            echo "LOADER_VERSION=$(prop loader_version)"
            echo "FABRIC_API_VERSION=$(prop fabric_api_version)"
          } >> "$GITHUB_ENV"
      - name: build
        run: ./gradlew build
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          Elytra Drag $MOD_VERSION for Minecraft $MINECRAFT_VERSION (Fabric).

          Requirements:
          - Minecraft $MINECRAFT_VERSION
          - Fabric Loader $LOADER_VERSION or newer
          - Fabric API $FABRIC_API_VERSION or newer
          - Java 25

          Put \`elytra-drag-$MOD_VERSION.jar\` in your \`mods\` folder.
          EOF
          gh release create "$RELEASE_TAG" "build/libs/elytra-drag-$MOD_VERSION.jar" \
            --target "$GITHUB_SHA" \
            --title "Elytra Drag $MOD_VERSION" \
            --notes-file release-notes.md
